name: generate ASCII Art

on:
  push
jobs:
  readme_job_0:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: Welcome message
      run: echo "My frist job"
           ls -ltra
           cat README.md
      
  build_job_1:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: List Repo Files
      run: ls -ltra

    - name: Execuring Shell Script
      run: |
        chmod +x ascii-script.sh
        ./ascii-script.sh
    
    - name: Upload Dragon Text File
      uses: actions/upload-artifact@v7
      with:
        name: dragon-text-file
        path: dragon.txt
  
  test_job_2:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
    - name: Download Dragon Text File
      uses: actions/download-artifact@v3.1.0
      with:
        name: dragon-text-file
        path: dragon.txt

    - name: Test File
      run: grep -i "dragon" dragon.txt

  deploy_job-3:
    needs: [test_job_2]
    runs-on: ubuntu-latest
    steps:
    - name: Read Files
      run: cat dragon.txt


