name: generate ASCII Art

on:
  push
jobs:
  readme_job_0:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: Welcome message
      run: echo "My frist job"
           ls -ltra
           cat README.md
      
  build_job_1:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: List Repo Files
      run: ls -ltra

    - name: Execuring Shell Script
      run: |
        chmod +x ascii-script.sh
        ./ascii-script.sh
  
      
