name: generate ASCII Art

on:
  push
jobs:
  readme_job_0:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: Welcome message
      run: echo "My frist job"
           ls -ltra
           cat README.md
      
  build_job_1:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v5

    - name: List Repo Files
      run: ls -ltra

    - name: Execuring Shell Script
      run: |
        chmod +x ascii-script.sh
        ./ascii-script.sh
  
  test_job_2:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
    - name: Sleep 10 sec
      run: sleep 10

    - name: Test File
      run: grep -i "dragon" dragon.txt

  deploy_job-3:
    needs: [test_job_2]
    runs-on: ubuntu-latest
    steps:
    - name: Read Files
      run: cat dragon.txt


